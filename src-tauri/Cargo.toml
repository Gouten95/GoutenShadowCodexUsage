[package]
name = "codex-usage-glance"
version = "0.3.1"
description = "Monitor local de uso de Codex"
authors = ["Codex Usage Glance"]
edition = "2021"

[lib]
name = "codex_usage_glance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
